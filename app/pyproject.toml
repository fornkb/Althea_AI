[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "althea-app"
version = "1.0.0"
description = "Integrated persistent Althea AI local application"
requires-python = ">=3.12"
dependencies = ["althea-ingestion==1.0.0", "althea-analysis==1.0.0", "althea-evidence-ui==1.0.0", "Flask>=3.1,<4", "waitress>=3,<4"]

[project.scripts]
althea = "althea_app.__main__:main"
althea-web = "althea_app.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
althea_app = ["templates/*.html", "static/*.js", "static/*.css", "static/*.svg"]
