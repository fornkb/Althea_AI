[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "althea-evidence-ui"
version = "1.0.0"
description = "Source-grounded evidence assessment and standalone Althea dashboard"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "google-genai>=2.28,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
legacy-ui = ["streamlit>=1.40,<2"]

[project.scripts]
althea-evidence = "althea_evidence_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
althea_evidence_ui = ["data/*.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: explicit authorized cloud smoke, excluded by default"]
