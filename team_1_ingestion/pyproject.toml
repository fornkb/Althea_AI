[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "althea-ingestion"
version = "1.0.0"
description = "Validated audio ingestion and versioned SQLite storage for Althea AI"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "google-genai>=2.28,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
althea-ingestion = "althea_ingestion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
althea_ingestion = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: explicit authorized cloud smoke, excluded by default"]
